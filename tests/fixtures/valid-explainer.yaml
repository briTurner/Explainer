schemaVersion: 0.1.0
metadata:
  title: Request Authentication Walkthrough
  domain: codebase
scenes:
  - id: request-enters-api
    title: The request enters the API layer
    narration:
      - kind: text
        text: The request reaches the API controller, which extracts the token before delegating validation.
    visual:
      kind: sequence
      elements:
        - id: client
          kind: rectangle
          label: Client
        - id: api-controller
          kind: rectangle
          label: API Controller
          artifactRefs:
            - api-controller-source
      relationships:
        - id: client-to-api
          from: client
          to: api-controller
          label: GET /profile
          endDecoration: arrow
    artifacts:
      - id: api-controller-source
        kind: sourceFile
        title: API controller request entry point
        locator:
          kind: workspacePath
          path: Sources/API/ProfileController.swift
          range:
            startLine: 18
            endLine: 31
    focus:
      - target:
          kind: element
          id: api-controller
        role: primary
    animations:
      - kind: tracePath
        target:
          kind: relationship
          id: client-to-api
        durationMs: 700
        onComplete: hold
